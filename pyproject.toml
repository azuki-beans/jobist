[project]
name = "jobist"
version = "0.2.0"
description = "Job batch che cerca ogni giorno annunci di lavoro con Claude (web search) e invia un digest tramite Apprise (email, Telegram, Slack, ntfy, ...)"
authors = [{ name = "Marco Pavanelli" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "anthropic (>=2.8,<3)",
    "apprise (>=2.2,<3)",
    "pydantic-settings (>=2.16,<3)",
    "google-cloud-storage (>=3.17,<4)",
]

[project.scripts]
jobist = "jobist.cli:main"

[tool.poetry]
packages = [{ include = "jobist" }]

[tool.poetry.group.dev.dependencies]
pytest = "^9"
ruff = "^0.15"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
