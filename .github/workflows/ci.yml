name: CI

# Solo controlli: non pubblica niente.
on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Dipendenze
        run: |
          pip install poetry
          poetry install --no-interaction --no-ansi

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Test
        run: poetry run pytest -q
